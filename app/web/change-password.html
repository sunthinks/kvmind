<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVMind — 修改密码</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%272%27 y=%272%27 width=%2760%27 height=%2760%27 rx=%272.5%27 ry=%272.5%27 fill=%27%237f9d8c%27/%3E%3Cg fill=%27%23f1e9d8%27%3E%3Crect x=%2714%27 y=%2720%27 width=%2736%27 height=%2724%27 fill=%27none%27 stroke=%27%23f1e9d8%27 stroke-width=%273%27/%3E%3Crect x=%2744%27 y=%2728%27 width=%2710%27 height=%278%27 fill=%27%237f9d8c%27/%3E%3Crect x=%2748%27 y=%2728%27 width=%276%27 height=%278%27/%3E%3Crect x=%2750%27 y=%2730%27 width=%272%27 height=%274%27 fill=%27%237f9d8c%27/%3E%3Crect x=%276%27 y=%2730%27 width=%2734%27 height=%274%27/%3E%3Crect x=%2726%27 y=%2750%27 width=%2712%27 height=%274%27/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;background:#f1e6cf;display:flex;align-items:center;justify-content:center;padding:24px}

.card{width:100%;max-width:440px;background:#fbf5e6;border:1px solid #c8b89a;border-radius:16px;padding:40px;box-shadow:0 24px 64px rgba(0,0,0,0.4)}

.card-icon{width:56px;height:56px;border-radius:14px;background:rgba(127,157,140,0.1);border:1px solid rgba(127,157,140,0.2);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:20px}

.card-title{font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:8px}
.card-desc{font-size:14px;color:#6b5a46;margin-bottom:28px;line-height:1.6}

/* Language switcher */
.lang-group{position:absolute;top:20px;right:24px;display:flex;gap:4px;z-index:2}
.lang-btn{padding:6px 12px;border:1px solid #c8b89a;border-radius:6px;background:#f6efe0;color:#6b5a46;font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit}
.lang-btn:hover{border-color:#7f9d8c;color:#6b8979}
.lang-btn.active{background:#7f9d8c;color:#1a1a1a;border-color:#7f9d8c;font-weight:600}

/* Error / Success */
.msg{display:none;padding:10px 14px;margin-bottom:16px;border-radius:8px;font-size:13px}
.msg.error{background:rgba(178,58,42,0.1);border:1px solid rgba(178,58,42,0.25);color:#b23a2a;animation:shake .4s ease}
.msg.success{background:rgba(127,157,140,0.12);border:1px solid rgba(127,157,140,0.35);color:#5c7768}
.msg.show{display:block}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Inputs */
.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:500;color:#3a2f24;margin-bottom:6px}
.field input{width:100%;padding:12px 16px;border-radius:8px;border:1px solid #c8b89a;background:#f6efe0;color:#1a1a1a;font-size:14px;outline:none;transition:border-color .3s;font-family:inherit}
.field input:focus{border-color:#7f9d8c}
.field input::placeholder{color:#6b5a46}

/* Password strength */
.pw-strength{height:3px;border-radius:2px;background:#c8b89a;margin-top:6px;overflow:hidden}
.pw-strength-bar{height:100%;width:0;border-radius:2px;transition:width .3s,background .3s}
.pw-hint{font-size:11px;color:#6b5a46;margin-top:4px}

/* Button */
.submit-btn{width:100%;padding:13px;border:none;border-radius:8px;background:linear-gradient(135deg,#7f9d8c,#6b8979);color:#1a1a1a;font-size:15px;font-weight:600;cursor:pointer;transition:all .3s;font-family:inherit;margin-top:8px}
.submit-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 4px 16px rgba(127,157,140,0.3)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:none}
.cancel-btn{width:100%;padding:12px;border:1px solid #c8b89a;border-radius:8px;background:transparent;color:#3a2f24;font-size:14px;font-weight:500;cursor:pointer;transition:all .3s;font-family:inherit;margin-top:8px}
.cancel-btn:hover{border-color:#6b5a46;color:#1a1a1a;background:#f6efe0}

/* Responsive */
@media(max-width:480px){
  .card{padding:28px 24px}
  .card-title{font-size:18px}
}
</style>
</head>
<body>

<div class="lang-group">
  <button class="lang-btn active" onclick="setLang('zh')">中文</button>
  <button class="lang-btn" onclick="setLang('ja')">日本語</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
</div>

<div class="card">
  <div class="card-icon">🔐</div>
  <h2 class="card-title" data-i18n="title">修改设备密码</h2>
  <p class="card-desc" data-i18n="desc">首次登录需要修改默认密码。新密码至少8个字符。</p>

  <div id="msg" class="msg"></div>

  <div class="field">
    <label for="input-old" data-i18n="label_current">当前密码</label>
    <input type="password" id="input-old" data-i18n-ph="ph_current" placeholder="输入当前密码" autocomplete="current-password">
  </div>

  <div class="field">
    <label for="input-new" data-i18n="label_new">新密码</label>
    <input type="password" id="input-new" data-i18n-ph="ph_new" placeholder="至少8个字符" autocomplete="new-password" oninput="checkStrength()">
    <div class="pw-strength"><div class="pw-strength-bar" id="pw-bar"></div></div>
    <div class="pw-hint" id="pw-hint" data-i18n="pw_hint_none"></div>
  </div>

  <div class="field">
    <label for="input-confirm" data-i18n="label_confirm">确认新密码</label>
    <input type="password" id="input-confirm" data-i18n-ph="ph_confirm" placeholder="再次输入新密码" autocomplete="new-password"
           onkeydown="if(event.key==='Enter')doChange()">
  </div>

  <button class="submit-btn" id="btn-submit" onclick="doChange()" data-i18n="btn_change">修改密码</button>
  <button class="cancel-btn" onclick="history.back()" data-i18n="btn_cancel">取消</button>
</div>

<script src="/kdkvm/kvmind-i18n.js?v=202604230230"></script>
<script>
// ── i18n（字典来自 /kdkvm/kvmind-i18n.js，change_password 命名空间）────
KVMindI18n.init('change_password');
var t = function (k, vars) { return KVMindI18n.t(k, vars); };
var setLang = function (v) { KVMindI18n.setLang(v); };
KVMindI18n.onLangChange(function () { checkStrength(); });

function showMsg(text,type){
  var el=document.getElementById('msg');
  el.textContent=text;
  el.className='msg '+type+' show';
}

function checkStrength(){
  var pw=document.getElementById('input-new').value;
  var bar=document.getElementById('pw-bar');
  var hint=document.getElementById('pw-hint');
  if(!pw){bar.style.width='0';hint.textContent='';return}
  var score=0;
  if(pw.length>=8)score++;
  if(pw.length>=12)score++;
  if(/[A-Z]/.test(pw)&&/[a-z]/.test(pw))score++;
  if(/\d/.test(pw))score++;
  if(/[^A-Za-z0-9]/.test(pw))score++;

  if(score<=2){
    bar.style.width='33%';bar.style.background='#b23a2a';
    hint.textContent=t('pw_hint_weak');hint.style.color='#b23a2a';
  }else if(score<=3){
    bar.style.width='66%';bar.style.background='#d29922';
    hint.textContent=t('pw_hint_medium');hint.style.color='#d29922';
  }else{
    bar.style.width='100%';bar.style.background='#7f9d8c';
    hint.textContent=t('pw_hint_strong');hint.style.color='#7f9d8c';
  }
}

async function doChange(){
  document.getElementById('msg').className='msg';
  var oldPw=document.getElementById('input-old').value;
  var newPw=document.getElementById('input-new').value;
  var confirm=document.getElementById('input-confirm').value;

  if(!oldPw){showMsg(t('err_old'),'error');return}
  if(newPw.length<8){showMsg(t('err_new_short'),'error');return}
  if(newPw!==confirm){showMsg(t('err_mismatch'),'error');return}
  if(newPw===oldPw){showMsg(t('err_same'),'error');return}

  var btn=document.getElementById('btn-submit');
  btn.disabled=true;
  btn.textContent=t('btn_changing');

  try{
    var r=await fetch('/kdkvm/api/auth/change-password',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({old_password:oldPw,new_password:newPw})
    });
    var d=await r.json();
    if(r.ok&&d.status==='ok'){
      showMsg(t('success'),'success');
      setTimeout(function(){window.location.href='/'},1500);
    }else{
      console.error('Change password error:', d.error);
      showMsg(t('err_net'),'error');
      btn.disabled=false;
      btn.textContent=t('btn_change');
    }
  }catch(e){
    showMsg(t('err_net'),'error');
    btn.disabled=false;
    btn.textContent=t('btn_change');
  }
}

// Language init handled by KVMindI18n.init('change_password') above.
</script>
</body>
</html>
